<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎙️ Namma Ooru Express — Voice Ordering</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      width: 100%;
      padding: 16px 24px;
      text-align: center;
      color: white;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .header h1 { font-size: 1.3rem; font-weight: 700; }
    .header p { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }

    .container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      color: white;
      font-size: 0.75rem;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    .status-dot.recording { background: #ef4444; }
    .status-dot.thinking { background: #fbbf24; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Chat Area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      margin-bottom: 16px;
      min-height: 300px;
      max-height: 50vh;
    }

    .message {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.ai { justify-content: flex-start; }
    .message.user { justify-content: flex-end; }

    .message .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.ai .avatar { background: rgba(99, 102, 241, 0.3); }
    .message.user .avatar { background: rgba(236, 72, 153, 0.3); }

    .message .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .message.ai .bubble {
      background: rgba(255,255,255,0.95);
      color: #1f2937;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: rgba(99, 102, 241, 0.9);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message .time {
      font-size: 0.65rem;
      opacity: 0.6;
      margin-top: 4px;
    }

    /* Mic Controls */
    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }

    .mic-btn {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      font-size: 32px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }

    .mic-btn:hover { transform: scale(1.05); }
    .mic-btn:active { transform: scale(0.95); }

    .mic-btn.recording {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      animation: recording-pulse 1s infinite;
      box-shadow: 0 4px 30px rgba(239, 68, 68, 0.6);
    }

    .mic-btn.disabled {
      background: #6b7280;
      cursor: not-allowed;
      box-shadow: none;
    }

    @keyframes recording-pulse {
      0%, 100% { box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 4px 40px rgba(239, 68, 68, 0.8); }
    }

    .mic-label {
      color: white;
      font-size: 0.8rem;
      opacity: 0.8;
      text-align: center;
    }

    /* Language Toggle */
    .lang-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .lang-btn {
      padding: 6px 14px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.3);
      background: transparent;
      color: white;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: rgba(255,255,255,0.2);
      border-color: white;
    }

    /* Text input fallback */
    .text-input-row {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 400px;
    }

    .text-input-row input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      color: white;
      font-size: 0.85rem;
      outline: none;
    }

    .text-input-row input::placeholder { color: rgba(255,255,255,0.5); }

    .text-input-row button {
      padding: 10px 16px;
      border-radius: 20px;
      border: none;
      background: #6366f1;
      color: white;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Waveform */
    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 30px;
    }

    .waveform .bar {
      width: 4px;
      background: white;
      border-radius: 2px;
      animation: wave 0.8s ease infinite;
    }

    @keyframes wave {
      0%, 100% { height: 8px; }
      50% { height: 24px; }
    }

    .waveform .bar:nth-child(1) { animation-delay: 0s; }
    .waveform .bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform .bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform .bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform .bar:nth-child(5) { animation-delay: 0.4s; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎙️ Namma Ooru Express</h1>
    <p>AI Voice Ordering — Speak Tamil, English or Tanglish!</p>
  </div>

  <div class="container">
    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Ready — Tap mic to speak</span>
    </div>

    <div class="chat-area" id="chatArea">
      <!-- Messages will be added here -->
    </div>

    <div class="controls">
      <div class="lang-toggle">
        <button class="lang-btn active" data-lang="ta" onclick="setLang('ta')">தமிழ்</button>
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">English</button>
        <button class="lang-btn" data-lang="tanglish" onclick="setLang('tanglish')">Tanglish</button>
      </div>

      <button class="mic-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
      <div class="mic-label" id="micLabel">Tap to speak</div>

      <div class="text-input-row">
        <input type="text" id="textInput" placeholder="Or type here..." onkeypress="handleKeyPress(event)">
        <button onclick="sendText()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // ━━━ CONFIG ━━━
    const SERVER_URL = window.location.origin; // Same server serves this UI
    let currentLang = 'ta';
    let isRecording = false;
    let mediaRecorder = null;
    let audioChunks = [];
    let callId = 'browser_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    let sessionStarted = false;

    // ━━━ INIT ━━━
    window.onload = async () => {
      // Start session
      try {
        const res = await fetch(`${SERVER_URL}/api/pipeline/start-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            callId,
            callerPhone: '+91browser_test',
            language: currentLang
          })
        });
        const data = await res.json();
        if (data.success) {
          sessionStarted = true;
          addMessage('ai', data.greeting || 'Vanakkam! Namma Ooru Express. Enna order pannanum?');
          speak(data.greeting || 'Vanakkam! Namma Ooru Express. Enna order pannanum?');
        }
      } catch (err) {
        addMessage('ai', 'Server connection failed. Make sure server is running on port 4000.');
        console.error('Session start error:', err);
      }
    };

    // ━━━ LANGUAGE ━━━
    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }

    // ━━━ RECORDING ━━━
    async function toggleRecording() {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = async () => {
          const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
          stream.getTracks().forEach(t => t.stop());
          await processAudio(audioBlob);
        };

        mediaRecorder.start();
        isRecording = true;
        updateUI('recording');
      } catch (err) {
        console.error('Mic error:', err);
        addMessage('ai', '⚠️ Microphone access denied. Please allow mic permissions.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
        isRecording = false;
        updateUI('thinking');
      }
    }

    // ━━━ PROCESS AUDIO (Send to server) ━━━
    async function processAudio(audioBlob) {
      const formData = new FormData();
      formData.append('audio', audioBlob, 'recording.webm');
      formData.append('callId', callId);
      formData.append('language', currentLang);

      try {
        const res = await fetch(`${SERVER_URL}/api/pipeline/process-voice`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (data.customerText) {
          addMessage('user', data.customerText);
        }

        if (data.text) {
          addMessage('ai', data.text);
          
          // Play audio if returned
          if (data.audioBase64) {
            playAudioBase64(data.audioBase64);
          } else {
            // Fallback: use browser TTS
            speak(data.text);
          }
        }

        if (data.toolCalled) {
          console.log('🔧 Tool used:', data.toolCalled);
        }

        updateUI('ready');
      } catch (err) {
        console.error('Process error:', err);
        addMessage('ai', '⚠️ Error processing audio. Server might be down.');
        updateUI('ready');
      }
    }

    // ━━━ SEND TEXT (Fallback when mic not available) ━━━
    async function sendText() {
      const input = document.getElementById('textInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      addMessage('user', text);
      updateUI('thinking');

      try {
        const res = await fetch(`${SERVER_URL}/api/pipeline/process-text`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            callId,
            text,
            language: currentLang
          })
        });

        const data = await res.json();

        if (data.text) {
          addMessage('ai', data.text);
          if (data.audioBase64) {
            playAudioBase64(data.audioBase64);
          } else {
            speak(data.text);
          }
        }

        updateUI('ready');
      } catch (err) {
        console.error('Text process error:', err);
        addMessage('ai', '⚠️ Server error. Try again.');
        updateUI('ready');
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendText();
    }

    // ━━━ AUDIO PLAYBACK ━━━
    function playAudioBase64(base64) {
      const audio = new Audio('data:audio/mp3;base64,' + base64);
      audio.play().catch(console.error);
    }

    // ━━━ BROWSER TTS FALLBACK ━━━
    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = currentLang === 'ta' ? 'ta-IN' : 'en-IN';
        utterance.rate = 0.9;
        speechSynthesis.speak(utterance);
      }
    }

    // ━━━ UI HELPERS ━━━
    function addMessage(role, text) {
      const chatArea = document.getElementById('chatArea');
      const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      
      const msgHtml = `
        <div class="message ${role}">
          ${role === 'ai' ? '<div class="avatar">🤖</div>' : ''}
          <div>
            <div class="bubble">${text}</div>
            <div class="time">${time}</div>
          </div>
          ${role === 'user' ? '<div class="avatar">👤</div>' : ''}
        </div>
      `;
      
      chatArea.insertAdjacentHTML('beforeend', msgHtml);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function updateUI(state) {
      const micBtn = document.getElementById('micBtn');
      const micLabel = document.getElementById('micLabel');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      switch (state) {
        case 'recording':
          micBtn.className = 'mic-btn recording';
          micBtn.textContent = '⏹️';
          micLabel.textContent = 'Recording... Tap to stop';
          statusDot.className = 'status-dot recording';
          statusText.textContent = '🔴 Listening...';
          break;
        case 'thinking':
          micBtn.className = 'mic-btn disabled';
          micBtn.textContent = '⏳';
          micLabel.textContent = 'AI is thinking...';
          statusDot.className = 'status-dot thinking';
          statusText.textContent = '🤔 Processing...';
          break;
        case 'ready':
        default:
          micBtn.className = 'mic-btn';
          micBtn.textContent = '🎤';
          micLabel.textContent = 'Tap to speak';
          statusDot.className = 'status-dot';
          statusText.textContent = 'Ready — Tap mic to speak';
          break;
      }
    }
  </script>
</body>
</html>
